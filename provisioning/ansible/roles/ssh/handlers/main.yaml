---
# Both listen to the same topic and run in this order; a failed validation
# stops the play before the reload.
- name: Validate the sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: Validate and reload sshd

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  listen: Validate and reload sshd
  tags: [service]
