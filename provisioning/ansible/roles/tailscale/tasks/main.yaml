---
# Installs Tailscale only. Joining the tailnet needs a short-lived auth key
# and happens during enrollment, never from tracked configuration.
- name: Install the Tailscale archive key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Add the Tailscale apt repository
  vars:
    tailscale_release: "{{ ansible_facts['distribution_release'] }}"
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"
    content: |
      # Tailscale packages for ubuntu {{ tailscale_release }}
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ tailscale_release }} main
  register: tailscale_repo

- name: Install Tailscale
  ansible.builtin.apt:
    name:
      - tailscale
      # Keeps the archive key current after installation.
      - tailscale-archive-keyring
    state: present
    update_cache: "{{ tailscale_repo is changed }}"

- name: Enable tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  tags: [service]
