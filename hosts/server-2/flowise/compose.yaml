x-stack:
  requires: []
services:
  flowise:
    image: ${FLOWISE_IMAGE:?Set FLOWISE_IMAGE in flowise/.env}
    container_name: flowise
    restart: unless-stopped
    init: true
    ports:
    - target: 3003
      published: '3003'
      host_ip: ${FLOWISE_BIND_ADDRESS:-127.0.0.1}
      protocol: tcp
    - target: 3003
      published: '3003'
      host_ip: ${FLOWISE_BIND_ADDRESS_V6:-::1}
      protocol: tcp
    networks:
    - flowise
    mem_limit: ${FLOWISE_MEMORY_LIMIT:-1g}
    cpus: 2.0
    pids_limit: 512
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3003/api/v1/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    env_file:
    - path: /opt/flowise/app.env
      format: raw
    volumes:
    - type: bind
      source: ${FLOWISE_DATA_DIR:?Set FLOWISE_DATA_DIR}
      target: /root/flowise
      bind:
        create_host_path: false
networks:
  flowise:
    driver: bridge
    ipam:
      config:
      - subnet: ${FLOWISE_SUBNET:?Set FLOWISE_SUBNET}
