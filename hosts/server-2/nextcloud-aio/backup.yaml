# Nextcloud's database and app volumes are left out for now. Their coordinated
# capture first copies about 14 GiB to the root disk, which it can no longer
# spare next to K3s. Re-include them once the backup's state directory has its
# own volume, by restoring the commented declaration below.
paths:
- /opt/nextcloud-aio
# Required: the Compose service mounts it. AIO's own settings, read live.
volumes:
- nextcloud_aio_mastercontainer
