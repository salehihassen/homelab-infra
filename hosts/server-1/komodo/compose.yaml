# Komodo (KOMODO_DOMAIN): web UI for every Compose stack on this host, later
# on the other servers too. Core stores its state in FerretDB, a MongoDB-compatible
# layer over its own Postgres + DocumentDB container (separate from the shared
# `postgres` stack). Periphery is the agent that runs Docker for Core.
#
# Komodo runs `docker compose` for the `opt` project, which includes Komodo
# itself: change Komodo's own services from the CLI, not from its UI.
x-stack:
  requires: []

services:
  komodo-postgres:
    # Pinned: FerretDB and DocumentDB versions must match.
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0@sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7
    container_name: komodo-postgres
    labels:
      komodo.skip: ""   # never stopped by Komodo's StopAllContainers
    restart: unless-stopped
    env_file: /opt/komodo/komodo.env
    environment:
      POSTGRES_DB: postgres
    volumes:
      - /opt/komodo/postgres:/var/lib/postgresql/data
    networks:
      - komodo
    shm_size: 128mb
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komodo -d postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  komodo-ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0@sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985
    container_name: komodo-ferretdb
    labels:
      komodo.skip: ""
    restart: unless-stopped
    user: "1000:1000"
    env_file: /opt/komodo/komodo.env
    environment:
      FERRETDB_TELEMETRY: disable
    volumes:
      - /opt/komodo/ferretdb:/state
    networks:
      - komodo
    depends_on:
      komodo-postgres:
        condition: service_healthy
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2.3.3@sha256:bca73d0eee143066228fb9b80c38a5a2726e573ad2758f7aa92b5c91a8aef1c7
    container_name: komodo-core
    labels:
      komodo.skip: ""
    init: true
    restart: unless-stopped
    env_file: /opt/komodo/komodo.env
    environment:
      TZ: ${TZ:?Set TZ in /opt/.env}
      KOMODO_HOST: https://${KOMODO_DOMAIN:?Set KOMODO_DOMAIN in komodo/routing.env}
      KOMODO_TITLE: Komodo ${KOMODO_SERVER_NAME:?Set KOMODO_SERVER_NAME in komodo/.env}
      KOMODO_DATABASE_ADDRESS: komodo-ferretdb:27017
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_FIRST_SERVER_NAME: ${KOMODO_SERVER_NAME:?Set KOMODO_SERVER_NAME in komodo/.env}
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_ENABLE_NEW_USERS: "false"
      KOMODO_DISABLE_NON_ADMIN_CREATE: "true"
      KOMODO_JWT_TTL: 1-day
      KOMODO_MONITORING_INTERVAL: 15-sec
      KOMODO_RESOURCE_POLL_INTERVAL: 1-hr
    ports:
      # Loopback only; tailnet access is through Caddy (KOMODO_DOMAIN).
      - "127.0.0.1:9120:9120"
    volumes:
      - /opt/komodo/keys:/config/keys
      # Komodo's own dated database backups ("Backup Core Database" procedure).
      - /opt/komodo/backups:/backups
    networks:
      - komodo
    depends_on:
      - komodo-ferretdb
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.3@sha256:fa3f1a641a265216066676950d5eecdf506955a7bafe2f01996135ae93115cd5
    container_name: komodo-periphery
    labels:
      komodo.skip: ""
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:?Set TZ in /opt/.env}
      # Outbound connection to Core; no Periphery port is published.
      PERIPHERY_CORE_ADDRESS: ws://komodo-core:9120
      PERIPHERY_CONNECT_AS: ${KOMODO_SERVER_NAME:?Set KOMODO_SERVER_NAME in komodo/.env}
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_ROOT_DIRECTORY: /opt/komodo/periphery
      # No shells from the web UI: Periphery has the Docker socket.
      PERIPHERY_DISABLE_TERMINALS: "true"
      PERIPHERY_DISABLE_CONTAINER_TERMINALS: "true"
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - /opt/komodo/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Compose resolves paths on the client, so Periphery sees the stack
      # definitions, build contexts, env files and secrets at their host paths.
      - ${KOMODO_REPOS_DIR:?Set KOMODO_REPOS_DIR in komodo/.env}:${KOMODO_REPOS_DIR}:ro
      - /opt:/opt:ro
      - /opt/komodo/periphery:/opt/komodo/periphery
    networks:
      - komodo
    depends_on:
      - komodo-core
    mem_limit: 512m
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  komodo:
    ipam:
      config:
        - subnet: ${KOMODO_SUBNET:?Set KOMODO_SUBNET in komodo/.env}
    driver: bridge
