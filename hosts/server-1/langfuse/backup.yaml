# Nightly backup declaration for the langfuse stack; format in docs/backups.md.
paths:
  - /opt/langfuse/compose.env
  - /opt/langfuse/routing.env
  - /opt/langfuse/langfuse.env
  - /opt/langfuse/clickhouse.env
  - /opt/langfuse/redis.env
  - /opt/langfuse/minio.env
exclude:
  /opt/clickhouse/data: trace store excluded by policy; archive-to-trace replay is not implemented or verified
  /opt/minio/data: raw ingestion events excluded by policy; archive-to-trace replay is not implemented or verified
  /opt/redis/data: transient ingestion queue
postgres:
  - langfuse
