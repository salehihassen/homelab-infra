# MeTube video downloader; downloads land in /opt/youtube-download.
x-stack:
  requires: []

services:
  metube:
    image: ghcr.io/alexta69/metube:2026.08.21@sha256:c2920f86f888b5398e5a964e135417fe11418823988399e6ec230293dcc0bb31
    container_name: metube
    restart: unless-stopped
    ports:
     - "8082:8081"
    volumes:
     - /opt/youtube-download:/downloads
    networks:
      - metube
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  metube:
    ipam:
      config:
        - subnet: ${METUBE_SUBNET:?Set METUBE_SUBNET in metube/.env}
    driver: bridge
