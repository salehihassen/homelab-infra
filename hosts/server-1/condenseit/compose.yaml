# CondenseIt digest reader (NEWS_DOMAIN); image published to GHCR from its own repository (CONDENSEIT_IMAGE).
x-stack:
  requires:
    - ai-gateway   # network cpa_policy_model, service ai-policy-proxy

services:
  # Digest reader. Its SQLite data under /opt/condenseit is exported with
  # SQLite's online backup API by the nightly backup (see backup.yaml).
  condenseit:
    image: ${CONDENSEIT_IMAGE:?Set CONDENSEIT_IMAGE in condenseit/.env}
    container_name: condenseit
    restart: unless-stopped
    init: true
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export CONDENSEIT_AUTH_PASSWORD="$$(cat /run/secrets/condenseit_auth_password)"
        export DIGEST_PWA_SESSION_SECRET="$$(cat /run/secrets/condenseit_session_secret)"
        export OPENAI_API_KEY="$$(cat /run/secrets/condenseit_cpa_key)"
        exec condenseit serve --host 0.0.0.0 --port 8899
    environment:
      CONDENSEIT_CONFIG: /app/config.yaml
      CONDENSEIT_DATA_DIR: /app/data
      CONDENSEIT_FRONTEND_DIST: /app/frontend/dist
      CONDENSEIT_SCHEDULER_ENABLED: "0"
      TZ: ${TZ:?Set TZ in /opt/.env}
    ports:
      - "127.0.0.1:8899:8899"
    volumes:
      - /opt/condenseit/config.yaml:/app/config.yaml:ro
      - /opt/condenseit/data:/app/data
    secrets:
      - source: condenseit_auth_password
        target: condenseit_auth_password
      - source: condenseit_session_secret
        target: condenseit_session_secret
      - source: condenseit_cpa_key
        target: condenseit_cpa_key
    networks:
      - condenseit
      - cpa_policy_model
    depends_on:
      ai-policy-proxy:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Stack-private bridge for internet egress (feed fetching).
  condenseit:
    ipam:
      config:
        - subnet: ${CONDENSEIT_SUBNET:?Set CONDENSEIT_SUBNET in condenseit/.env}
    driver: bridge

secrets:
  condenseit_auth_password:
    file: /opt/condenseit/secrets/auth-password
  condenseit_session_secret:
    file: /opt/condenseit/secrets/session-secret
  condenseit_cpa_key:
    file: /opt/condenseit/secrets/cpa-client-key
