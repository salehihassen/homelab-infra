# Shared PostgreSQL 18 cluster, its admin UI, and the retired 12.3 instance.
#
# Provides to other stacks:
#   network `postgres_network` (opt_postgres_network) - join it to reach `postgres:5432`
#   service `postgres` - depend on it with `condition: service_healthy`
# Each consumer owns its own database and role; see README.md.
x-stack:
  requires: []

services:
  # Retired PostgreSQL 12.3 (EOL). Superseded by the PostgreSQL 18 service
  # below; data kept at /opt/postgresql/data in case something still needs
  # dumping. Not started by `docker compose up -d`; to run it:
  #   docker compose --profile deprecated up -d pg-deprecated
  pg-deprecated:
    container_name: pg-deprecated
    image: postgres:12.3-alpine
    profiles: ["deprecated"]
    restart: "no"
    env_file: "/opt/postgres.env"
    ports:
      - 5432:5432
    volumes:
      - /opt/postgresql/data:/var/lib/postgresql/data

  # PostgreSQL 18.6 + pgvector 0.8.6. Replaced the EOL 12.3 instance above;
  # The application database was migrated to PostgreSQL 18 on 2026-09-09.
  # Published on loopback only -- reach it from other tailnet hosts through
  # pgadmin, or bind a private host address for direct client connections.
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: postgres
    restart: unless-stopped
    # POSTGRES_PASSWORD comes from this 0600 file rather than being inlined
    # here, since this compose file is world-readable.
    env_file: /opt/postgresql/postgres18.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in postgres/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in postgres/.env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # PG18 moved PGDATA to /var/lib/postgresql/<major>/docker and declares its
      # volume one level up, so the parent is what gets mounted. Mounting
      # .../data (the pre-18 habit) starts fine but loses data on recreate.
      - /opt/postgresql/data18:/var/lib/postgresql
      - /opt/postgresql/initdb18:/docker-entrypoint-initdb.d:ro
    networks:
      # The only network Postgres joins. Every client stack attaches to it
      # explicitly, so database access is visible in each stack's compose file.
      - postgres_network
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in postgres/.env} -d ${POSTGRES_DB:?Set POSTGRES_DB in postgres/.env}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.17@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    restart: unless-stopped
    env_file: "/opt/postgres.env"
    ports:
      # Loopback only; tailnet access is through Caddy (PGADMIN_DOMAIN).
      - "127.0.0.1:15432:80"
    volumes:
      - /opt/pgadmin:/var/lib/pgadmin
    networks:
      - postgres_network
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:80/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  postgres_network:
    ipam:
      config:
        - subnet: ${POSTGRES_SUBNET:?Set POSTGRES_SUBNET in postgres/.env}
    name: opt_postgres_network
    driver: bridge
