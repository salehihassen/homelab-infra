  icon: mdi:calendar-clock
  availability: '{{ as_timestamp(states(''sensor.antigravity_usage_updated''), 0) > as_timestamp(now()) - 2700 and (state_attr(''sensor.antigravity_usage_updated'',
    ''buckets'') or {}).get(''gemini-5h'', {}).get(''resets_at'') is not none }}'
  state: '{{ (state_attr(''sensor.antigravity_usage_updated'', ''buckets'') or {}).get(''gemini-5h'', {}).get(''resets_at'') }}'
