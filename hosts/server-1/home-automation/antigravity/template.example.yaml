# Merge these items into template.sensor, alongside any existing sensor entries.
sensor:
- name: Antigravity Gemini 5h Remaining
  unique_id: antigravity_gemini_5h_remaining
  unit_of_measurement: '%'
  state_class: measurement
  icon: mdi:timer-sand
  availability: '{{ as_timestamp(states(''sensor.antigravity_usage_updated''), 0) > as_timestamp(now()) - 2700 and (state_attr(''sensor.antigravity_usage_updated'',
    ''buckets'') or {}).get(''gemini-5h'', {}).get(''remaining'') is number }}'
  state: '{{ (state_attr(''sensor.antigravity_usage_updated'', ''buckets'') or {}).get(''gemini-5h'', {}).get(''remaining'') }}'
  attributes:
    resets_at: '{{ (state_attr(''sensor.antigravity_usage_updated'', ''buckets'') or {}).get(''gemini-5h'', {}).get(''resets_at'') }}'
- name: Antigravity Gemini 5h Resets At
