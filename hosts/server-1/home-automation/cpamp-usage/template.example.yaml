# Merge these items into template.sensor, alongside any existing sensor entries.
sensor:
- name: AI API-Equivalent Cost
  unique_id: cpamp_total_api_cost
  icon: mdi:cash
  unit_of_measurement: 'USD'
  state_class: total
  device_class: monetary
  availability: "{{ as_timestamp(states('sensor.cpamp_usage_updated'), 0) > as_timestamp(now()) - 7200 and ((state_attr('sensor.cpamp_usage_updated', 'totals') or {}).get('api_equivalent_usd')) is number }}"
  state: "{{ (state_attr('sensor.cpamp_usage_updated', 'totals') or {}).get('api_equivalent_usd') }}"
- name: AI Input Tokens
  unique_id: cpamp_total_input_tokens
  icon: mdi:import
  unit_of_measurement: 'M tokens'
  state_class: total
  availability: "{{ as_timestamp(states('sensor.cpamp_usage_updated'), 0) > as_timestamp(now()) - 7200 and ((state_attr('sensor.cpamp_usage_updated', 'totals') or {}).get('input_tokens')) is number }}"
  state: "{{ (((state_attr('sensor.cpamp_usage_updated', 'totals') or {}).get('input_tokens')) / 1000000) | round(3) }}"
- name: AI Cache Read Tokens
