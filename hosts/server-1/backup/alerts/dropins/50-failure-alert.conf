# Installed as /etc/systemd/system/<backup unit>.service.d/50-failure-alert.conf
# for infra-backup.service and infra-backup-maintenance.service.
[Unit]
OnFailure=infra-backup-alert@%n.service

[Service]
# Records the time of a successful run for the overdue check. The leading "-"
# means this bookkeeping can never change the job's result.
ExecStopPost=-/usr/local/sbin/infra-backup-alert record-result %n
