        {
          "series": "node_filesystem_avail_bytes{stack=\"ai-observability\",host=\"server\",device=\"/dev/root-lv\",mountpoint=\"/telemetry-disks/root\",instance=\"new\"}",
          "values": "21474836480+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "4m",
          "alertname": "HostRootDiskCritical",
          "exp_alerts": [
            {
              "exp_labels": {
                "alertname": "HostRootDiskCritical",
                "stack": "ai-observability",
                "severity": "critical",
                "category": "disk",
                "host": "server",
                "device": "/dev/root-lv"
              },
              "exp_annotations": {
                "summary": "Host root filesystem has less than 30 GiB available"
              }
            }
          ]
        }
