    {
      "name": "recreated collector keeps a single root alert",
      "interval": "30s",
      "input_series": [
        {
          "series": "node_filesystem_avail_bytes{stack=\"ai-observability\",host=\"server\",device=\"/dev/root-lv\",mountpoint=\"/telemetry-disks/root\",instance=\"old\"}",
