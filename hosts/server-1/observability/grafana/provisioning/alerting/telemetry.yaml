{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "ai-observability",
      "folder": "AI Observability",
      "interval": "20s",
      "rules": [
        {
          "uid": "telemetry-prometheus-alerts",
          "title": "Telemetry control-plane alert",
          "condition": "B",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Alerting",
          "isPaused": false,
          "annotations": {
            "summary": "Telemetry alert: {{ $labels.signal }}",
            "description": "See Telemetry health and Prometheus alert state. Notification delivery requires an operator-configured contact point."
          },
          "labels": {
            "stack": "ai-observability"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 60,
                "to": 0
              },
              "model": {
                "expr": "label_replace(ALERTS{alertstate=\"firing\",stack=\"ai-observability\"}, \"signal\", \"$1\", \"alertname\", \"(.*)\")",
                "instant": true,
                "range": false,
                "refId": "A",
                "intervalMs": 15000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "type": "threshold",
                "expression": "A",
                "refId": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "A"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ]
        }
      ]
    }
  ]
}
