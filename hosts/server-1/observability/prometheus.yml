# Prometheus stores agent metrics that Alloy forwards over OTLP
# (/api/v1/otlp), and control-plane exporter metrics over private remote-write.
global:
  scrape_interval: 60s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: alloy
    scrape_interval: 15s
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          stack: ai-observability

# Keep these OTLP resource attributes as labels so metrics can be split by
# machine, agent and environment.
otlp:
  promote_resource_attributes:
    - service.name
    - service.version
    - host.name
    - deployment.environment
    - deployment.environment.name

storage:
  tsdb:
    # Clients batch and retry; accept samples that arrive a little late.
    out_of_order_time_window: 30m
