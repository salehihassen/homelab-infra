# Caddy on the host reaches Garage outside Pod policy filtering. Twenty also
# accesses its separate bucket directly; browsers go through Twenty's API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage-from-twenty
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: twenty
          podSelector:
            matchLabels:
              app.kubernetes.io/name: twenty
      ports:
        - {protocol: TCP, port: 3900}
