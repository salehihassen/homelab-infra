apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: garage
resources:
  - namespace.yaml
  - statefulset.yaml
  - service.yaml
  - network-policy.yaml
# A config change gets a new name, so Garage restarts with it.
configMapGenerator:
  - name: garage-config
    files:
      - garage.toml
