apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
spec:
  serviceName: garage
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  # Keep the data volume if the StatefulSet is deleted or scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        homelab.example/cluster: public-edge
        homelab.example/local-storage: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
          # On first start, lay out the single node and create the key and
          # bucket below; later starts find them and change nothing.
          command: [/garage, server, --single-node, --default-bucket]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef: {name: garage-credentials, key: GARAGE_RPC_SECRET}
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: garage-credentials, key: GARAGE_DEFAULT_ACCESS_KEY}
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: garage-credentials, key: GARAGE_DEFAULT_SECRET_KEY}
            - name: GARAGE_DEFAULT_BUCKET
              value: kaneo-uploads
          ports:
            - name: s3
              containerPort: 3900
            - name: admin
              containerPort: 3903
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # Defined with PostgreSQL: Retain, bound to the node that holds it.
        storageClassName: local-retain
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
