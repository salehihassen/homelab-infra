apiVersion: v1
kind: Pod
metadata:
  name: kaneo-data-helper
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 3600
  automountServiceAccountToken: false
  nodeSelector:
    homelab.example/cluster: public-edge
    homelab.example/kaneo-storage: "true"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: helper
      # Reuse the app's verified image for its shell/tar; never start the app.
      image: ghcr.io/usekaneo/kaneo:2.47.1@sha256:880b2df38fe5385032c9772c8989182d45029bc1f1711a3cb9489b94f482848d
      command: [sleep, "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 200m, memory: 128Mi}
      volumeMounts:
        - name: data
          mountPath: /recovery
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: kaneo-data
