apiVersion: v1
kind: Service
metadata:
  name: kaneo-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kaneo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: kaneo-postgres-headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: kaneo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
