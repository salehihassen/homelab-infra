apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaneo-postgres
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kaneo-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaneo-postgres
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        homelab.example/cluster: public-edge
        homelab.example/kaneo-storage: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
          env:
            - name: POSTGRES_DB
              value: kaneo
            - name: POSTGRES_USER
              value: kaneo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: kaneo-credentials, key: POSTGRES_PASSWORD}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            exec: {command: [pg_isready, -U, kaneo, -d, kaneo]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, kaneo, -d, kaneo]}
          livenessProbe:
            exec: {command: [pg_isready, -U, kaneo, -d, kaneo]}
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: runtime
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: kaneo-postgres}
        - name: runtime
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
