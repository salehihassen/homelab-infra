apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kaneo-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: kaneo-local-retain
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kaneo-postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: kaneo-local-retain
  resources:
    requests:
      storage: 10Gi
