apiVersion: v1
kind: Service
metadata:
  name: twenty
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: twenty
    app.kubernetes.io/component: server
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: twenty-redis
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: twenty-redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
