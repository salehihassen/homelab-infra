apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: twenty-to-dependencies
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: twenty
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: twenty-redis
      ports:
        - {protocol: TCP, port: 6379}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: twenty
              app.kubernetes.io/component: server
      ports:
        - {protocol: TCP, port: 3000}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: garage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: garage
      ports:
        - {protocol: TCP, port: 3900}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-from-twenty
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: twenty
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: twenty
      ports:
        - {protocol: TCP, port: 3000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-twenty
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: twenty-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: twenty
      ports:
        - {protocol: TCP, port: 6379}
