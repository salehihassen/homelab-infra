apiVersion: v1
kind: ConfigMap
metadata:
  name: twenty-config
data:
  NODE_PORT: "3000"
  IS_CONFIG_VARIABLES_IN_DB_ENABLED: "false"
  IS_MULTIWORKSPACE_ENABLED: "true"
  DEFAULT_SUBDOMAIN: app
  IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: "true"
  IS_BILLING_ENABLED: "false"
  SIGN_IN_PREFILLED: "false"
  REDIS_URL: redis://twenty-redis.twenty.svc.cluster.local:6379
  SERVER_INTERNAL_URL: http://twenty.twenty.svc.cluster.local:3000
  STORAGE_TYPE: s3
  STORAGE_S3_REGION: garage
  STORAGE_S3_NAME: twenty-uploads
  STORAGE_S3_ENDPOINT: http://garage.garage.svc.cluster.local:3900
  STORAGE_S3_PRESIGNED_URL_ENABLED: "false"
  HOME: /tmp
  NODE_OPTIONS: --max-old-space-size=512
  YARN_ENABLE_IMMUTABLE_INSTALLS: "true"
