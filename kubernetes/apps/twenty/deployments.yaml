apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-server
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: twenty
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twenty
        app.kubernetes.io/component: server
        homelab.example/postgres-client: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        homelab.example/cluster: public-edge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: twentycrm/twenty:v2.59.0@sha256:76933f24d3781a3a90809857217b0cfd70735b0fa79eee4acc76956573810439
          envFrom:
            - configMapRef: {name: twenty-config}
            - configMapRef: {name: twenty-settings}
            - secretRef: {name: twenty-credentials}
          env:
            - name: STORAGE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: twenty-storage, key: S3_ACCESS_KEY_ID}
            - name: STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: twenty-storage, key: S3_SECRET_ACCESS_KEY}
            - name: DISABLE_DB_MIGRATIONS
              value: "false"
            - name: DISABLE_CRON_JOBS_REGISTRATION
              value: "false"
          ports:
            - {name: http, containerPort: 3000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: local-storage, mountPath: /app/packages/twenty-server/.local-storage}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: local-storage
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-worker
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: twenty
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twenty
        app.kubernetes.io/component: worker
        homelab.example/postgres-client: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        homelab.example/cluster: public-edge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-server
          image: twentycrm/twenty:v2.59.0@sha256:76933f24d3781a3a90809857217b0cfd70735b0fa79eee4acc76956573810439
          command: [sh, -ec, "until curl --fail --silent http://twenty:3000/healthz > /dev/null; do sleep 5; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: worker
          image: twentycrm/twenty:v2.59.0@sha256:76933f24d3781a3a90809857217b0cfd70735b0fa79eee4acc76956573810439
          args: [node, dist/queue-worker/queue-worker]
          envFrom:
            - configMapRef: {name: twenty-config}
            - configMapRef: {name: twenty-settings}
            - secretRef: {name: twenty-credentials}
          env:
            - name: STORAGE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: twenty-storage, key: S3_ACCESS_KEY_ID}
            - name: STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: twenty-storage, key: S3_SECRET_ACCESS_KEY}
            - name: DISABLE_DB_MIGRATIONS
              value: "true"
            - name: DISABLE_CRON_JOBS_REGISTRATION
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 352Mi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe:
            exec:
              command: [sh, -ec, "tr '\\000' ' ' < /proc/1/cmdline | grep -q '^node dist/queue-worker/queue-worker'"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -ec, "tr '\\000' ' ' < /proc/1/cmdline | grep -q '^node dist/queue-worker/queue-worker'"]
            periodSeconds: 30
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: local-storage, mountPath: /app/packages/twenty-server/.local-storage}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: local-storage
          emptyDir: {sizeLimit: 256Mi}
