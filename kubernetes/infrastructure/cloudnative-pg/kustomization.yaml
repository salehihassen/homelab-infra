apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - operator.yaml
images:
  - name: ghcr.io/cloudnative-pg/cloudnative-pg
    newTag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
patches:
  # Deleting a CRD deletes every resource of that kind, including databases.
  # CRD descriptions also contain literal ${...} text that Flux must not expand.
  - target:
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
        value: disabled
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1substitute
        value: disabled
