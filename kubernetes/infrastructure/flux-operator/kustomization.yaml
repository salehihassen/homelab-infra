apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # namespace.yaml is applied once at bootstrap. The FluxInstance owns the
  # generated namespace afterwards; keep it out of the root's inventory.
  - operator.yaml
  - network-policy.yaml
patches:
  - target:
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
        value: disabled
