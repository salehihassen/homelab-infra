apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kaneo
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/kaneo
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  wait: true
  # Prepare credentials, URL, storage ownership and recovery keys before sync.
  suspend: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
