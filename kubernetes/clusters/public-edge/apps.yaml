apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kaneo
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/kaneo
  dependsOn:
    - name: postgres
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  wait: true
  # Create Kaneo's credentials and settings first (docs/kubernetes/kaneo.md).
  suspend: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
