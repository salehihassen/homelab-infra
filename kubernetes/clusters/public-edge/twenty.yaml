apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: twenty-database
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/databases/postgres/app-databases/twenty
  dependsOn:
    - name: postgres
  sourceRef: {kind: GitRepository, name: flux-system}
  prune: false
  wait: true
  suspend: false
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: has(status.applied) && status.applied
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied
  decryption:
    provider: sops
    secretRef: {name: sops-age}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: twenty
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./kubernetes/apps/twenty
  dependsOn:
    - name: postgres
    - name: garage
    - name: twenty-database
  sourceRef: {kind: GitRepository, name: flux-system}
  prune: false
  wait: true
  suspend: false
  decryption:
    provider: sops
    secretRef: {name: sops-age}
