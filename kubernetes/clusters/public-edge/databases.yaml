apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/databases/postgres
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  wait: true
  # Prepare the existing Kaneo namespace/credentials and storage owner first.
  suspend: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
