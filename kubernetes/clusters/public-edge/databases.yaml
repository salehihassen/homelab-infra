apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/databases/postgres
  dependsOn:
    - name: cloudnative-pg
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  wait: true
  # Flux cannot read CloudNativePG readiness on its own; these tell it when
  # the database, roles and databases are actually ready.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    # No `failed` expressions: applied=false can be transient (a Database
    # reconciled before its owner role), so Flux waits until the timeout instead.
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: has(status.applied) && status.applied
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied
  suspend: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
