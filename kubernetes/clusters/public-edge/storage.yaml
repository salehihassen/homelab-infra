apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/storage/garage
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  wait: true
  # Create Garage's credentials first (docs/kubernetes/garage.md).
  suspend: false
