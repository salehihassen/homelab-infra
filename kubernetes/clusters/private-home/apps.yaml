apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/podinfo
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  suspend: false
